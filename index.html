<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#145c48"><link rel="manifest" href="manifest.json"><title>Household Information System</title><link rel="stylesheet" href="style.css"></head><body><div id="lock" class="lock"><div class="lockcard"><div class="logo">⌂</div><h1>Household Information System</h1><p>Local resident registry</p><label for="pin">App PIN (optional lock)</label><input id="pin" inputmode="numeric" type="password" maxlength="12" placeholder="Set a PIN or leave blank"><button id="unlock">Open system</button><small>Data stays on this device/browser. Set a PIN to lock the interface.</small></div></div><div id="app" hidden><header><div class="brand"><div class="logo">⌂</div><div><b>Household Information System</b><small>Offline resident registry</small></div></div><button class="iconbtn" id="lockBtn" title="Lock">🔒</button></header><nav><button class="nav active" data-page="dashboard">Overview</button><button class="nav" data-page="residents">Residents</button><button class="nav" data-page="households">Households</button><button class="nav" data-page="reports">Reports</button><button class="nav" data-page="backup">Backup</button></nav><main><section id="dashboard" class="page"></section><section id="residents" class="page" hidden></section><section id="households" class="page" hidden></section><section id="reports" class="page" hidden></section><section id="backup" class="page" hidden></section></main><dialog id="recordDialog"><form id="residentForm" method="dialog"><div class="modalhead"><h2 id="formTitle">Add resident</h2><button type="button" class="iconbtn" id="closeForm">✕</button></div><input type="hidden" id="rid"><div class="formgrid"><fieldset><legend>Personal information</legend><label>Last name*<input id="last" required></label><label>First name*<input id="first" required></label><label>Middle name<input id="middle"></label><label>Suffix<input id="suffix" placeholder="Jr., Sr., III"></label><label>Birthdate<input id="birth" type="date"></label><label>Gender<select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select></label><label>Contact number<input id="contact" type="tel"></label><label>Email<input id="email" type="email"></label><label>Religion<input id="religion"></label><label>Nationality<input id="nationality" value="Filipino"></label></fieldset><fieldset><legend>Location & household</legend><label>Location<select id="location"><option></option><option>Pulo</option><option>Proper</option><option>Athena</option></select></label><label id="sublocWrap" hidden>Sub-location<select id="subloc"><option></option><option>Bungad</option><option>Gitna</option><option>Dulo</option></select></label><label>Address<textarea id="address" rows="2"></textarea></label><label>City registered voter<input id="voterCity"></label><label>Household ID<input id="householdId" placeholder="e.g. PULO-001"></label><label>Household head?<select id="head"><option>No</option><option>Yes</option></select></label><label>Relationship to household head<input id="relationship" placeholder="Head, spouse, child, etc."></label></fieldset><fieldset><legend>Family & social</legend><label>Civil status<select id="civil"><option></option><option>Single</option><option>Married</option><option>Widowed</option><option>Annulled</option><option>Divorced</option><option>Lived-in</option></select></label><label>Spouse / partner<input id="spouse"></label><label>Solo parent<select id="solo"><option>No</option><option>Yes</option></select></label><label>Number of children<input id="children" type="number" min="0" value="0"></label><label>PWD<select id="pwd"><option>No</option><option>Yes</option></select></label><label>Disability<input id="disability"></label></fieldset><fieldset><legend>Education</legend><label>Enrolled<select id="enrolled"><option>No</option><option>Yes</option></select></label><label>Current level<select id="currentLevel"></select></label><label>Highest educational attainment<select id="highest"></select></label></fieldset><fieldset><legend>Employment</legend><label>Employed<select id="employed"><option>No</option><option>Yes</option></select></label><label>Employment type<select id="employmentType"><option></option><option>Employee</option><option>Business Owner</option><option>Self-Employed</option></select></label><label>Place of work / type of business<input id="work"></label></fieldset></div><div class="formactions"><button type="button" class="secondary" id="cancelForm">Cancel</button><button class="primary" type="submit">Save resident</button></div></form></dialog><dialog id="viewDialog"><div class="modalhead"><h2>Resident profile</h2><button class="iconbtn" id="closeView">✕</button></div><div id="profile"></div></dialog><div id="toast"></div></div><script src="app.js"></script></body></html>
